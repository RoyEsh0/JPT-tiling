<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jpt-tiling-site</title>
  </head>
  <body class="bg-stone-50 text-stone-800">
  <header class="bg-white shadow">
    <nav class="mx-auto flex max-w-5xl items-center justify-between p-4">
      <a href="#" class="text-xl font-bold text-brand">JPT tiling Company</a>
      <ul class="flex gap-6">
        <li><a href="#projects" class="hover:text-amber-600">Projects</a></li>
        <li><a href="#about" class="hover:text-amber-600">About</a></li>
        <li><a href="#contact" class="hover:text-amber-600">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="bg-stone-800 py-24 text-center text-white">
      <div class="mx-auto max-w-3xl px-4">
        <h1 class="text-4xl font-bold md:text-6xl">Quality tiling, done right</h1>
        <p class="mt-4 text-lg text-stone-300">
          Kitchens, bathrooms, floors and more.
        </p>
        <a
          href="#projects"
          class="mt-8 inline-block rounded bg-brand px-6 py-3 font-semibold text-stone-900 hover:bg-amber-400"
        >
          See our work
        </a>
      </div>
    </section>
    <section id="projects" class="mx-auto max-w-5xl. px-4 py-16">
      <h2 class="text-3xl font-bold">Our Projects</h2>
      <div id="project-list" class="mt-8 grid gap-6 md:grid-cols-3"></div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
